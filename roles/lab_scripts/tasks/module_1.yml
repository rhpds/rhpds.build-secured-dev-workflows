---
# Module 1: RHTPA Installation and SBOM Upload Tasks

- name: Generate install-rhtpa.sh script
  ansible.builtin.template:
    src: install-rhtpa.sh.j2
    dest: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/install-rhtpa.sh"
    mode: '0755'
  delegate_to: bastion

- name: Generate upload-sbom.sh script
  ansible.builtin.template:
    src: upload-sbom.sh.j2
    dest: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/upload-sbom.sh"
    mode: '0755'
  delegate_to: bastion

- name: Display script locations
  ansible.builtin.debug:
    msg:
    - "ADS RHTPA scripts generated in ~/lab-assets:"
    - "  install-rhtpa.sh"
    - "  upload-sbom.sh"
    - ""
    - "Scripts reference existing YAML files in ~/lab-assets:"
    - "  keycloak-tpa-realm.yml"
    - "  tpa-cli-credentials.yml"
    - "  tpa-instance.yml"

- name: Save user information
  agnosticd.core.agnosticd_user_info:
    data:
      rhtpa_install_script: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/install-rhtpa.sh"
      rhtpa_upload_script: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/upload-sbom.sh"
