---
# Module 2: RHTAS Installation and Image Signing Tasks
- name: Generate install-rhtas.sh script
  ansible.builtin.template:
    src: install-rhtas.sh.j2
    dest: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/install-rhtas.sh"
    mode: '0755'
  delegate_to: bastion

- name: Generate test-image-signing.sh script
  ansible.builtin.template:
    src: test-image-signing.sh.j2
    dest: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/test-image-signing.sh"
    mode: '0755'
  delegate_to: bastion

- name: Copy solve-module-2.sh script
  ansible.builtin.copy:
    src: solve-module-2.sh
    dest: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/solve-module-2.sh"
    mode: '0755'
  delegate_to: bastion

- name: Generate reset-module-2.sh script
  ansible.builtin.template:
    src: reset-module-2.sh.j2
    dest: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/reset-module-2.sh"
    mode: '0755'
  delegate_to: bastion

- name: Generate validate-module-2.sh script
  ansible.builtin.template:
    src: validate-module-2.sh.j2
    dest: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/validate-module-2.sh"
    mode: '0755'
  delegate_to: bastion

- name: Display RHTAS script locations
  ansible.builtin.debug:
    msg:
    - "RHTAS scripts generated in ~/lab-assets:"
    - "  install-rhtas.sh"
    - "  test-image-signing.sh"
    - "  solve-module-2.sh"
    - "  reset-module-2.sh"
    - "  validate-module-2.sh"
    - ""
    - "Scripts reference existing YAML files in ~/lab-assets:"
    - "  tas-instance.yml"
    - "  oidc-info-secret.yml"
    - "  oidc-refresher-app.yml"
    - "  tekton-chains-patch.yml"
    - "  example-image-sign.yml"

- name: Save RHTAS script information
  agnosticd.core.agnosticd_user_info:
    data:
      rhtas_install_script: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/install-rhtas.sh"
      rhtas_test_script: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/test-image-signing.sh"
      module_2_solve_script: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/solve-module-2.sh"
      module_2_reset_script: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/reset-module-2.sh"
      module_2_validate_script: "{{ rhpds_build_secured_dev_workflows_lab_scripts_output_dir }}/validate-module-2.sh"
